[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "krishidrishti-ai"
version = "0.1.0"
description = "Image diagnosis module for KrishiDrishti AI"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "earthengine-api>=0.1.400",
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.9",
    "Pillow>=10.4,<12.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
